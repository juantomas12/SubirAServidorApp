<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Información de las series</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
	<div class="app-container">
		<div class="card-shell">
			<div class="d-flex justify-content-between align-items-center mb-3">
				<h1 class="mb-0">Series</h1>
				<a class="btn btn-main btn-sm" th:if="${all}" th:href="@{/serie/add}">Añadir serie</a>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle">
					<thead>
						<tr>
							<th>Id Serie</th>
							<th>Título</th>
							<th>Año estreno</th>
							<th>Temporadas</th>
							<th>Plataforma</th>
							<th>Director</th>
							<th colspan="2" class="text-center">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="serie:${series}">
							<td>
							<a th:href="@{/serie/{id}(id=${serie.idSerie})}">
								<span th:text="${serie.idSerie}">Id</span></a>
							</td>
							<td th:text="${serie.titulo}">Titulo</td>
							<td th:text="${serie.anyoEstreno}">2020</td>
							<td th:text="${serie.temporadas}">1</td>
							<td><span class="badge badge-soft" th:text="${serie.plataforma}">Plataforma</span></td>
							<td >
								<span th:text="${serie.director != null} ? ${serie.director.nombre} : '--'">director</span>	
							</td>
							<td class="text-center"> <a class="btn btn-outline-light btn-sm" th:href="@{/serie/update/{id}(id=${serie.idSerie})}">Editar</a></td>
							<td class="text-center"> <a class="btn btn-outline-danger btn-sm" th:href="@{/serie/delete/{id}(id=${serie.idSerie})}">Eliminar</a></td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="d-flex justify-content-between mt-3">
				<div th:if="${all}">
					<a th:href="@{/}" class="link-light">← Volver al índice </a>
				</div>
				<div class="d-flex gap-3" th:if="!${all}">
					<a th:href="@{/director}" class="link-light">Regresar</a>
					<a class="btn btn-main btn-sm" th:href="@{/director/{id}/serie(id=${idDirector})}">Añadir serie a este director</a>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
