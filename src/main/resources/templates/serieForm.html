<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${nuevo}?'Alta de serie':'Modificar serie'">titulo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="app-container">
 <div class="card-shell">
  <h1 class="mb-3" th:text="${nuevo}?'Alta de serie':'Modificar serie'">titulo</h1>

  <form th:action="@{/serie/save}" th:object="${serie}" method="POST" class="row g-3">
    <div class="col-md-4" th:if="*{idSerie}">
      <label class="form-label">ID</label>
      <input type="text" class="form-control" th:field="*{idSerie}" readonly> 
    </div>
    
    <div class="col-md-8">
      <label class="form-label">Titulo</label>
      <input type="text" class="form-control" th:field="*{titulo}" required>
    </div>
    
    <div class="col-md-4">
      <label class="form-label">Año Estreno</label>
      <input type="number" class="form-control" th:field="*{anyoEstreno}" required>
    </div>
    
    <div class="col-md-4">
      <label class="form-label">Temporadas</label>
      <input type="number" class="form-control" th:field="*{temporadas}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Plataforma</label>
      <input type="text" class="form-control" th:field="*{plataforma}" required>
    </div>
    
    <div class="col-md-8">
      <label class="form-label">Director</label>
      <select class="form-select" id="idNewDire" name="idNewDire">                      
        <option value="0" selected>Selecciona director</option>
        <option 
            th:each="director: ${directores}" 
            th:value="${director.idDirector}"  
            th:text="${director.nombre}"
            th:selected="${!nuevo and director.idDirector == serie.director.idDirector}">
        </option>
    </select>
    </div>

  <div class="col-12">
    <button class="btn btn-main" type="submit" th:text="${nuevo}?'Guardar':'Modificar'">Guardar</button>
    <a class="btn btn-outline-light ms-2" th:href="@{/serie}">Cancelar</a>
  </div>
  </form>
 </div>
</div>
</body>
</html>
