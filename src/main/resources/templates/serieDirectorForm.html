<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alta de serie</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="app-container">
 <div class="card-shell">
  <h1 class="mb-3">Alta de serie</h1>

  <form th:action="@{/serie/save}" th:object="${serie}" method="POST" class="row g-3">

    <div class="col-12">
      <label class="form-label">Creando serie para</label>
      <div class="form-control-plaintext text-info fw-bold" th:utext="'<b>' + *{director.nombre}+ '</b>'"> nombreDire</div>
    </div>
	
    <div class="col-md-8">
      <label class="form-label">Titulo</label>
      <input type="text" class="form-control" th:field="*{titulo}" required>
    </div>
    
    <div class="col-md-4">
      <label class="form-label">Año Estreno</label>
      <input type="number" class="form-control" th:field="*{anyoEstreno}" required>
    </div>
    
    <div class="col-md-4">
      <label class="form-label">Temporadas</label>
      <input type="number" class="form-control" th:field="*{temporadas}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Plataforma</label>
      <input type="text" class="form-control" th:field="*{plataforma}" required>
    </div>
	
    <div class="col-md-8">
      <label class="form-label">Director</label>
      <input type="text" class="form-control" th:field="*{director.nombre}" readonly>
      <input type="hidden" id="idNewDire" name="idNewDire" th:value="*{director.idDirector}">
    </div>
	
  <div class="col-12">
    <button class="btn btn-main" type="submit">Guardar</button>
    <a class="btn btn-outline-light ms-2" th:href="@{/serie}">Cancelar</a>
  </div>
  </form>
 </div>
</div>
</body>
</html>
