<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Información del director</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
	<div class="app-container">
		<div class="card-shell">
			<div th:if="${!vacio}">
				<div th:object="${director}">
					<h1 class="mb-3">Ficha del director</h1>
					<p class="mb-1"><strong>Id:</strong> <span th:text="*{idDirector}">idDirector</span></p>
					<p class="mb-1"><strong>Nombre:</strong> <span th:text=" *{nombre}">nombre</span></p>
					<p class="mb-3"><strong>Año de nacimiento:</strong> <span th:text="*{anyoNacimiento}">anyo</span></p>
				</div>
			</div>
			<div th:if="${vacio}">
				<div class="alert alert-warning" role="alert" th:text="${msg}">mensaje </div>
			</div>
			<div class="d-flex gap-3 mt-3">
				<a class="btn btn-outline-light" th:href="@{/director}">Volver</a>
				<a class="btn btn-outline-info" th:href="@{/pelicula/director/{id}(id=${director.idDirector})}">Ver películas</a>
				<a class="btn btn-outline-info" th:href="@{/serie/director/{id}(id=${director.idDirector})}">Ver series</a>
			</div>
		</div>
	</div>
</body>
</html>
