<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Bienvenido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div class="app-container">
      <div class="card-shell text-center">
        <h1 class="mb-3" th:utext="${titulo}">Página principal</h1>
        <p class="lead text-secondary mb-4">Administra directores, películas y series desde un panel limpio y rápido.</p>
        <div class="d-flex justify-content-center gap-3 flex-wrap">
          <a class="btn btn-main px-4" th:href="@{/director}">Gestión de Directores</a>
          <a class="btn btn-outline-light px-4" th:href="@{/pelicula}">Gestión de Peliculas</a>
          <a class="btn btn-outline-light px-4" th:href="@{/serie}">Gestión de Series</a>
        </div>
      </div>
    </div>
</body>
</html>
