<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${nuevo}?'Alta de director':'Modificar director'">titulo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="app-container">
 <div class="card-shell">
  <h1 class="mb-3" th:text="${nuevo}?'Alta de director':'Modificar director'">titulo</h1>

  <form th:action="@{/director/save}" th:object="${director}" method="POST" class="row g-3">
    <div class="col-md-4" th:if="*{idDirector}">
      <label class="form-label">ID</label>
      <input type="text" class="form-control" th:field="*{idDirector}" readonly>
    </div>

    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Año Nacimiento</label>
      <input type="number" class="form-control" th:field="*{anyoNacimiento}" required>
    </div>

    <div class="col-12">
      <button class="btn btn-main" type="submit" th:text="${nuevo}?'Guardar':'Modificar'">Guardar</button>
      <a class="btn btn-outline-light ms-2" th:href="@{/director}">Cancelar</a>
    </div>
  </form>
 </div>
</div>
</body>
</html>
