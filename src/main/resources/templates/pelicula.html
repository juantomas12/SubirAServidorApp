<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Información de la película</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
	<div class="app-container">
		<div class="card-shell">
			<div th:if="${!vacio}">
				<div th:object="${pelicula}">
					<h1 class="mb-3">Ficha de la película</h1>
					<p class="mb-1"><strong>Id:</strong> <span th:text="*{idPelicula}">idPelicula</span></p>
					<p class="mb-1"><strong>Titulo:</strong> <span th:text=" *{titulo}">titulo</span></p>
					<p class="mb-1"><strong>Año de producción:</strong> <span th:text="*{anyo} ?: '--'">anyo</span></p>
					<p class="mb-1" th:if="*{director != null}"><strong>Director:</strong> <span th:text="*{director.nombre}">director</span></p>
				</div>
			</div>
			<div th:if="${vacio}">
				<div class="alert alert-warning" role="alert" th:text="${msg}">mensaje </div>
			</div>
			<div class="d-flex gap-3 mt-3">
				<a class="btn btn-outline-light" th:href="@{/pelicula}">Volver</a>
				<a class="btn btn-main" th:href="@{/pelicula/update/{id}(id=${pelicula.idPelicula})}" th:if="${!vacio}">Editar</a>
			</div>
		</div>
	</div>
</body>
</html>
