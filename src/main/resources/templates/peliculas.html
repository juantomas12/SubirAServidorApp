<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Información de las películas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
	<div class="app-container">
		<div class="card-shell">
			<div class="d-flex justify-content-between align-items-center mb-3">
				<h1 class="mb-0">Películas</h1>
				<a class="btn btn-main btn-sm" th:if="${all}" th:href="@{/pelicula/add}">Añadir película</a>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle">
					<thead>
						<tr>
							<th>Id</th>
							<th>Título</th>
							<th>Año</th>
							<th>Director</th>
							<th colspan="2" class="text-center">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="pelicula:${peliculas}">
							<td>
							<a th:href="@{/pelicula/{id}(id=${pelicula.idPelicula})}">
								<span th:text="${pelicula.idPelicula}">Id</span></a>
							
							</td>
							<td th:text="${pelicula.titulo}">Titulo</td>
							<td th:text="${pelicula.anyo} ?: '--'">2020</td>
							<td >
								<span th:text="${pelicula.director != null} ? ${pelicula.director.nombre} : '--'">director</span>	
							</td>
							<td class="text-center"> <a class="btn btn-outline-light btn-sm" th:href="@{/pelicula/update/{id}(id=${pelicula.idPelicula})}">Editar</a></td>
							<td class="text-center"> <a class="btn btn-outline-danger btn-sm" th:href="@{/pelicula/delete/{id}(id=${pelicula.idPelicula})}">Eliminar</a></td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="d-flex justify-content-between mt-3">
				<div th:if="${all}">
					<a th:href="@{/}" class="link-light">← Volver al índice</a>
				</div>
				<div class="d-flex gap-3" th:if="!${all}">
					<a th:href="@{/director}" class="link-light">Regresar a directores</a>
					<a class="btn btn-main btn-sm" th:href="@{/director/{id}/pelicula(id=${idDirector})}">Añadir película a este director</a>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
